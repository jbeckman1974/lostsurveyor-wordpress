name: Verified WordPress with libvips

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - verify.sh
      - .dockerignore
      - ci/**
      - tests/**
      - .github/workflows/image.yml
  pull_request:
    paths:
      - Dockerfile
      - verify.sh
      - .dockerignore
      - ci/**
      - tests/**
      - .github/workflows/image.yml
  schedule:
    # 04:35 UTC: 00:35 EDT / 23:35 EST, ahead of 02:15 local Watchtower.
    # GitHub can delay scheduled jobs; this is not a deployment deadline.
    - cron: '35 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lostsurveyor-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out build-only source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Regression checks
        run: python3 -m unittest discover -s tests -v
      - name: Clean build and real image tests
        run: python3 ci/image.py build
      - name: Authenticate ephemeral publisher
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified changes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 ci/image.py publish
      - name: Keep nonsecret build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: image-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-report.json
          if-no-files-found: ignore
          retention-days: 90
